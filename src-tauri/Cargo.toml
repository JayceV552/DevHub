[package]
name = "devhub"
version = "0.1.0"
description = "Local development workspace + GitHub activity hub"
authors = []
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"

[lib]
name = "devhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
sysinfo = "0.39"
netstat2 = "0.11.2"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
toml = "1.1.4"
dunce = "1.0.5"
keyring = { version = "4.1.6", features = ["v1"] }
reqwest = { version = "0.13.4", features = ["form", "json"] }
arboard = "3.6.1"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
glob = "0.3"
libc = "0.2.189"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.189"
